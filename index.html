<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRONPULSE | Premium Fitness Equipment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: #050505;
      border-bottom: 1px solid #222;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand span {
      color: #e00000;
    }

    .cart {
      background: #e00000;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 700;
    }

    .hero {
      max-width: 1150px;
      margin: auto;
      padding: 35px 20px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }

    .hero-photo {
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #222;
    }

    .hero-photo img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      padding: 12px;
      display: block;
      background: #111;
    }

    .eyebrow {
      color: #e00000;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero p {
      color: #bbb;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .price {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #e00000;
      color: #fff;
      padding: 15px 25px;
      border-radius: 7px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .button:hover {
      background: #b80000;
    }

    section {
      max-width: 1150px;
      margin: auto;
      padding: 60px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 36px;
      margin-bottom: 35px;
    }

    .product-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      overflow: hidden;
      max-width: 850px;
      margin: auto;
    }

    .product-card img {
      width: 100%;
      display: block;
      max-height: 600px;
      object-fit: contain;
      background: #080808;
    }

    .product-info {
      padding: 25px;
    }

    .product-info h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .product-info p {
      color: #bbb;
      margin-bottom: 15px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .feature {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
    }

    .feature img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #080808;
    }

    .feature-content {
      padding: 18px;
    }

    .feature h3 {
      margin-bottom: 7px;
    }

    .feature p {
      color: #aaa;
      font-size: 14px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .box {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 25px;
    }

    .box h3 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    .box p,
    .box li {
      color: #bbb;
    }

    .box ul {
      padding-left: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      background: #111;
      border: 1px solid #222;
    }
